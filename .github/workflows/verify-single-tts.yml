name: Verify local speech alignment
on:
  push:
    branches: [verify/single-tts]
permissions:
  contents: read
jobs:
  speech-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU alignment dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install -r requirements.txt
          python -m pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "stable-ts==2.19.1"
      - name: Align and render a German WAV without using Gemini
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory
          from unittest.mock import patch
          import wave
          import lesson

          story = json.loads(Path("example.json").read_text(encoding="utf-8"))
          with TemporaryDirectory() as tmp:
              folder = Path(tmp)
              starts = []
              full_pcm = bytearray(lesson.RATE // 2)
              for turn in story["turns"]:
                  turn["pause_ms"] = 0
                  starts.append(round(len(full_pcm) * 500 / lesson.RATE))
                  sample = str(folder / "line.wav")
                  subprocess.run(["espeak-ng", "-v", "de", "-s", "135", "-w", sample, turn["text"]], check=True)
                  full_pcm.extend(subprocess.check_output([
                      "ffmpeg", "-v", "error", "-i", sample, "-ar", str(lesson.RATE), "-ac", "1", "-f", "s16le", "-"
                  ]))
                  full_pcm.extend(bytes(lesson.RATE))
              stream = io.BytesIO()
              with wave.open(stream, "wb") as wav:
                  wav.setparams((1, 2, lesson.RATE, 0, "NONE", "not compressed"))
                  wav.writeframes(full_pcm)
              fixture = {"data": base64.b64encode(stream.getvalue()).decode()}
              with patch.object(lesson, "gemini", return_value=fixture) as tts:
                  video = lesson.render(story, folder / "output", key="fake")
                  assert tts.call_count == 1 and video.stat().st_size > 0
              timeline = json.loads(video.with_name("timeline.json").read_text(encoding="utf-8"))
              found = [turn["start_ms"] for turn in timeline]
              print("Reference speech starts:", starts, "aligned starts:", found)
              assert len(found) == len(starts)
              assert all(abs(a - b) <= 450 for a, b in zip(starts, found))
          PY
