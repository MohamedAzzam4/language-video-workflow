name: Verify single-request lesson audio
on:
  push:
    branches: [verify/single-tts]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -r requirements.txt
      - name: Run the regression suite without API credentials
        env:
          PYTHONIOENCODING: cp1252
        run: |
          python -m py_compile lesson.py test_lesson.py
          python -m unittest -v
