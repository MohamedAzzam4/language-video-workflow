name: Verify Lesson Studio browser flow
on:
  push:
    branches: [verify/single-tts]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -r requirements.txt playwright
      - name: Test copy, render, preview, and narrow layout
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from threading import Thread
          from playwright.sync_api import sync_playwright
          from werkzeug.serving import make_server
          from lesson_studio import create_app

          with TemporaryDirectory() as tmp, sync_playwright() as p:
              httpd = make_server("127.0.0.1", 0, create_app(Path(tmp), demo=True))
              thread = Thread(target=httpd.serve_forever, daemon=True)
              thread.start()
              try:
                  address = f"http://127.0.0.1:{httpd.server_port}/"
                  browser = p.chromium.launch(channel="chrome", headless=True)
                  ctx = browser.new_context(viewport={"width": 1280, "height": 980},
                                            permissions=["clipboard-read", "clipboard-write"])
                  page = ctx.new_page()
                  errors = []
                  page.on("pageerror", lambda error: errors.append(str(error)))
                  page.goto(address)
                  assert "Topic: (not supplied)" in page.locator("#prompt").input_value()
                  page.locator("#language").select_option("es-ES")
                  page.locator("#level").select_option("A2")
                  page.locator("#topic").fill("Missing the last train")
                  page.get_by_role("button", name="Copy prompt").click()
                  page.get_by_text("Copied.", exact=True).wait_for()
                  copied = page.evaluate("navigator.clipboard.readText()")
                  assert "Topic: Missing the last train" in copied
                  assert "Language: es-ES" in copied and "CEFR level: A2" in copied
                  page.get_by_role("button", name="Load example").click()
                  page.get_by_role("button", name="Render demo").click()
                  page.locator("video").wait_for()
                  page.wait_for_function("document.querySelector('video').duration > 0")
                  with page.expect_download() as download:
                      page.get_by_role("link", name="Download MP4").click()
                  assert download.value.suggested_filename == "video.mp4"
                  page.set_viewport_size({"width": 390, "height": 844})
                  assert page.evaluate("document.documentElement.scrollWidth === window.innerWidth")
                  assert not errors, errors
                  print("Studio browser smoke passed.")
                  browser.close()
              finally:
                  httpd.shutdown()
                  thread.join()
          PY
